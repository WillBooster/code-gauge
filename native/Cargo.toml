[package]
name = "code-gauge-native"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
regex = "1"

# Grammar crates are pinned to the exact versions of their npm counterparts so the native parser
# produces byte-identical trees to the node-tree-sitter backend.
tree-sitter = "0.22"
tree-sitter-c = "=0.21.4"
tree-sitter-cpp = "=0.22.3"
tree-sitter-go = "=0.21.2"
tree-sitter-java = "=0.21.0"
tree-sitter-javascript = "=0.21.4"
tree-sitter-python = "=0.21.0"
tree-sitter-ruby = "=0.21.0"
tree-sitter-rust = "=0.21.0"
tree-sitter-typescript = "=0.21.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1

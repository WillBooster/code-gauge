[package]
name = "code-gauge-native"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
regex = "1"
rustc-hash = "2"

# Grammar crates are pinned exactly: every metric (and the golden-based test suite) is calibrated
# against these grammar versions, so upgrades are deliberate, test-verified changes. The Kotlin
# grammar is WillBooster's fork, which is not on crates.io, pinned to a release tag. Core 0.25 is
# the first to load that grammar's ABI 15 parser, and tree-sitter-javascript 0.21.x pins
# `cc ~1.0`, which conflicts with the core's `cc ^1.2`, hence 0.25.0. The core reports no field for
# extra (error-recovery) children in ts_node_field_name_for_child, which
# util::find_children_by_field_name compensates for.
tree-sitter = "=0.25.10"
tree-sitter-c = "=0.21.4"
tree-sitter-c-sharp = "=0.21.3"
tree-sitter-cpp = "=0.22.3"
tree-sitter-go = "=0.21.2"
tree-sitter-java = "=0.21.0"
tree-sitter-kotlin = { package = "willbooster-tree-sitter-kotlin", git = "https://github.com/WillBooster/tree-sitter-kotlin", tag = "v1.1.0" }
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.21.0"
tree-sitter-ruby = "=0.21.0"
# 0.21.0 breaks MSVC (its build script passes the GCC-only -Wno-unused-parameter
# unconditionally; cl.exe fails with D8021); 0.21.2 gates the flag and the golden-based test
# suite verifies its grammar changes leave every measured metric unchanged.
tree-sitter-rust = "=0.21.2"
tree-sitter-typescript = "=0.21.2"

# The WebAssembly build (src/wasm.rs) exports a plain C ABI instead of N-API.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1

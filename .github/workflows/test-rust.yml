name: Test Rust
'on':
  pull_request: null
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test-rust:
    uses: WillBooster/reusable-workflows/.github/workflows/test-rust.yml@main
    with:
      github_hosted_runner: true
      working_directory: native

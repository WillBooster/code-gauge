name: Test Rust
'on':
  pull_request: null
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-rust:
    uses: WillBooster/reusable-workflows/.github/workflows/test-rust.yml@main
    permissions:
      actions: read
      contents: read
    with:
      github_hosted_runner: true
      working_directory: native

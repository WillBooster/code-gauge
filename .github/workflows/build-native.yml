name: Build Native
'on':
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
concurrency:
  # Pull-request runs share the ref's group and are cancelled by newer pushes; other runs (main
  # pushes, dispatches) get a per-commit group so every released commit keeps its own build: the
  # release pipeline (scripts/prepareNativePackages.mjs) waits for exactly its commit's run, and
  # a shared group would lose intermediate commits — a newer push cancels a RUNNING build with
  # cancel-in-progress, and GitHub's single-slot pending queue cancels a QUEUED one either way.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # GNU legs build in manylinux_2_28 containers: Node 24 supports Linux hosts down to
          # glibc 2.28, and building on the runner's Ubuntu would raise the artifact's glibc
          # floor to 2.34. The audit step fails the leg if a higher symbol version slips in;
          # the images ship no Node, so the smoke step fetches an official Node build — which
          # also proves the artifact loads at the glibc-2.28 floor itself.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            library: libcode_gauge_native.so
            container: quay.io/pypa/manylinux_2_28_x86_64
            setup: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            glibcMax: '2.28'
            nodeArch: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            library: libcode_gauge_native.so
            container: quay.io/pypa/manylinux_2_28_aarch64
            setup: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            glibcMax: '2.28'
            nodeArch: arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            library: libcode_gauge_native.dylib
            smoke: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            library: libcode_gauge_native.dylib
            smoke: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            library: code_gauge_native.dll
            smoke: true
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v5
      - if: matrix.setup
        run: ${{ matrix.setup }}
      # Each leg builds for its environment's host target, so the container's toolchain (glibc
      # 2.28) — not a cross-linker — produces the artifact.
      - run: cargo build --release
        working-directory: native
      - if: matrix.glibcMax
        run: |
          highest=$(objdump -T "native/target/release/${{ matrix.library }}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          echo "highest required glibc symbol version: $highest"
          ceiling="GLIBC_${{ matrix.glibcMax }}"
          if [ "$(printf '%s\n%s\n' "$highest" "$ceiling" | sort -V | tail -1)" != "$ceiling" ]; then
            echo "glibc floor $highest exceeds Node's supported baseline $ceiling"
            exit 1
          fi
      - if: matrix.smoke
        shell: bash
        run: |
          cp "native/target/release/${{ matrix.library }}" native/code-gauge.node
          node scripts/smokeNative.mjs
      # Smoke-load with an official glibc Node build inside the 2.28 container: link/ABI failures
      # (an unresolved symbol from a dependency bump) pass the compile and the symbol audit.
      - if: matrix.nodeArch
        run: |
          # The same Node version mise pins for this repository, so the smoke Node cannot drift
          # from the version the package targets.
          NODE_VERSION=$(sed -nE 's/^node *= *"([^"]+)".*/\1/p' mise.toml)
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${{ matrix.nodeArch }}.tar.gz" | tar -xz
          cp "native/target/release/${{ matrix.library }}" native/code-gauge.node
          "./node-v${NODE_VERSION}-linux-${{ matrix.nodeArch }}/bin/node" scripts/smokeNative.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: code-gauge-${{ matrix.target }}
          path: native/target/release/${{ matrix.library }}
          if-no-files-found: error
  # Musl legs build natively inside Alpine via `docker run` (GitHub cannot run its JS actions in
  # Alpine containers on arm64 runners, so `container:` is not an option) so the artifacts
  # actually link musl — a -crt-static cross-build on a glibc runner links glibc — and smoke-load
  # with a musl Node. Rust musl targets default to a static CRT, which cannot produce a cdylib.
  build-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          docker run --rm -v "$PWD:/work" -w /work rust:alpine sh -ec '
            apk add --no-cache build-base nodejs
            cd native
            RUSTFLAGS="-C target-feature=-crt-static" cargo build --release
            cd ..
            cp native/target/release/libcode_gauge_native.so native/code-gauge.node
            node scripts/smokeNative.mjs
          '
      - uses: actions/upload-artifact@v6
        with:
          name: code-gauge-${{ matrix.target }}
          path: native/target/release/libcode_gauge_native.so
          if-no-files-found: error
